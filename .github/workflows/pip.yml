name: Pip

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    name: Build with Pip
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # This is where correctness is checked, so it carries the full range of Python
      # versions -- on Linux, where the runners are cheapest. macOS and Windows take the
      # oldest and newest, which is where a version-dependent break would show up.
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - platform: macos-latest
            python-version: "3.11"
          - platform: macos-latest
            python-version: "3.13"
          - platform: windows-latest
            python-version: "3.11"
          - platform: windows-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set min macOS version
      if: runner.os == 'macOS'
      run: |
        echo "MACOS_DEPLOYMENT_TARGET=10.14" >> $GITHUB_ENV

    - name: Build and install
      run: pip install --verbose .

    - name: Test
      run: |
        python -m pip install pytest
        python -m pytest
