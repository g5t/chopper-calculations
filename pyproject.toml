[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.7.0",
            "setuptools_scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "chopcal"
description = "Provides the results of chopper calculations from McStas instruments"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gregory Tucker", email = "gregory.tucker@ess.eu" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
]
dynamic = ["version"]

[project.optional-dependencies]
# Zensical is pre-1.0 and ships weekly; pin exactly and bump deliberately. Kept in step
# with niess, which builds its site the same way.
docs = [
    "zensical==0.0.57",
    "mkdocstrings-python>=2.0.6",
]
# What the site's examples need over and above chopcal itself. They are executable modules
# run by test/test_docs_examples.py, and the ones that do not need numpy skip without it --
# which is what the wheel test job, carrying only pytest, exercises.
test = [
    "pytest",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/g5t/chopper-calculations"
Documentation = "https://g5t.github.io/chopper-calculations/"
Issues = "https://github.com/g5t/chopper-calculations/issues"
Source = "https://github.com/g5t/chopper-calculations"


[tool.setuptools_scm]


[tool.scikit-build]
# Use setuptoos-scm to discover the version number
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"


[tool.cibuildwheel]
# Include compilation build output
build-verbosity = 1

# Run pytest as part of the build
test-command = "pytest {project}/test"
test-requires = ["pytest"]
# skip testint on PyPy, musllinux and 32-bit for now to avoid trying to build scipy & scipp
test-skip = ["pp*", "*-musllinux*", "*-win32", "*-manylinux_i686"]

# Need for full C++17 support on MacOS
[tool.cibuildwheel.macos.environment]
MACOS_DEPLOYMENT_TARGET = "10.14"
