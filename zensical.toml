[project]
site_name = "chopcal"
site_description = "Chopper calculations from McStas instruments, in Python: where a chopper train puts the band, and what it lets through"
site_author = "Gregory Tucker"
site_url = "https://g5t.github.io/chopper-calculations/"
repo_url = "https://github.com/g5t/chopper-calculations"
repo_name = "g5t/chopper-calculations"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Gregory Tucker"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install and first band" = "getting-started.md" },
    { "Core concepts" = "concepts.md" },
  ] },
  { "How-to guides" = [
    { "Place the BIFROST band" = "how-to/place-the-band.md" },
    { "Describe a chopper" = "how-to/describe-a-chopper.md" },
    { "Find the band a train passes" = "how-to/find-the-band.md" },
    { "Build the transmitted region" = "how-to/transmitted-region.md" },
    { "Sample without wasting rays" = "how-to/sample-the-region.md" },
    { "Allow for a guide's path spread" = "how-to/path-spread.md" },
    { "Work on a grid instead" = "how-to/grid-and-mask.md" },
  ] },
  { "Reference" = [
    { "API: chopcal" = "reference/api/chopcal.md" },
    { "API: chopcal.lib" = "reference/api/lib.md" },
    { "Constants" = "reference/constants.md" },
  ] },
  { "Explanation" = [
    { "Three answers to one question" = "explanation/three-answers.md" },
    { "Why the window functions over-report" = "explanation/over-reporting.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/g5t/chopper-calculations"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/chopcal/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
# Without these two, `:material-rocket-launch:` and friends render as literal text: the
# extension is not loaded at all unless it is named here. Zensical ships both the resolver
# functions and the icon set, so the strings are all that is needed -- these are the values
# from its own bootstrap configuration.
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
# Examples are included from docs/examples rather than pasted, so they stay executable.
# test/test_docs_examples.py runs every one of them and checks the pages really include
# them -- an unknown region renders an empty code block in a build that still succeeds.
pymdownx.snippets.base_path = ["docs/examples", "."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

# No `paths` here on purpose. `chopcal.lib` re-exports nanobind classes from a compiled
# sibling, which griffe cannot read statically -- it has to import the extension -- and an
# *editable* install splits the package across src/ and site-packages, so pointing `paths`
# at src/ hides the extension and every re-export fails to resolve. Leaving griffe to find
# the installed package works, which is why the docs job installs chopcal normally rather
# than with -e. To build the site locally, do the same in a throwaway environment.
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "list"
filters = "public"
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
summary = true
